name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck rsync
      - name: Git identity for tests
        run: git config --global user.name ci && git config --global user.email "1+ci@users.noreply.github.com"
      - name: Unit tests
        run: tests/run.sh
      - name: No personal/lab info
        run: bin/render.sh --check
